async function save(filename,blob){
  try{ const d = window.claude && await window.claude.use("downloads");
    if(!d) return "na";
    await d.save({filename,data:blob});
    return "ok";
  }catch(e){ const c = e && e.code; if(["unavailable","host_unavailable","not_granted","capability_disabled","capability_removed"].includes(c)) return "na"; if(c!=="declined") alert("Could not save the file ("+(c||"error")+")."); return "err"; }
}
const CATS = ["Hardware","Network","Software","Printer","Other"];
const PRI = ["High","Medium","Low"];
const STAT = ["Pending","In Progress","Completed"];
const TABS = ["Dashboard","Daily Tasks","Meetings & Reminders","Work Log","Reports"];
const pad = n => String(n).padStart(2,"0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return dstr(d); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt = s => s ? new Date(s+"T00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "";

const seed = () => ({
  tasks:[
    {id:uid(),title:"OPD Printer network issue",category:"Printer",priority:"High",date:today(),status:"In Progress",notes:"Printer in OPD counter 3 not reachable. IP conflict suspected; reassigned static IP. Waiting to test token printing in the afternoon."},
    {id:uid(),title:"Server room temperature check",category:"Hardware",priority:"Medium",date:daysAgo(1),status:"Completed",notes:"AC unit 2 was running weak. Temperature back to 22°C after filter cleaning. Recheck weekly."},
    {id:uid(),title:"Install HMS update on billing PCs",category:"Software",priority:"High",date:today(),status:"Pending",notes:"Vendor sent patch. Need to schedule after 6 PM to avoid billing downtime."}
  ],
  meetings:[
    {id:uid(),date:today(),time:"15:00",topic:"HMS vendor call – billing patch",notes:"Confirm downtime window and rollback plan."},
    {id:uid(),date:daysAgo(-2),time:"11:30",topic:"Review CCTV NVR storage with admin",notes:"Bring disk usage report."}
  ]
});

function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const p = JSON.parse(r); if(p && p.tasks && p.meetings) return p; } }catch(e){}
  return {tasks:[],meetings:[]};
}

const badge = {
  High:"bg-red-100 text-red-700", Medium:"bg-amber-100 text-amber-800", Low:"bg-emerald-100 text-emerald-700",
  Pending:"bg-slate-200 text-slate-700", "In Progress":"bg-blue-100 text-blue-700", Completed:"bg-emerald-100 text-emerald-700"
};
const Pill = ({t}) => <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${badge[t]||"bg-slate-100"}`}>{t}</span>;
const Card = ({children,className=""}) => <div className={`bg-white border border-blue-100 rounded-lg shadow-sm ${className}`}>{children}</div>;
const Label = ({l,children}) => <label className="block text-sm font-medium text-slate-700">{l}<div className="mt-1">{children}</div></label>;

const COL = {Pending:"#94a3b8","In Progress":"#2a9df4",Completed:"#10b981"};
function Donut({items,center,sub}){
  const total = items.reduce((a,b)=>a+b[1],0)||1; let off = 25;
  return <div className="flex items-center gap-4 flex-wrap"><svg viewBox="0 0 42 42" className="w-36 h-36" role="img" aria-label="Status chart">
    <circle cx="21" cy="21" r="15.915" fill="none" stroke="#e6eef9" strokeWidth="5"/>
    {items.map(([l,v,c])=>{ const p=v/total*100; const el=<circle key={l} cx="21" cy="21" r="15.915" fill="none" stroke={c} strokeWidth="5" strokeDasharray={`${p} ${100-p}`} strokeDashoffset={off}/>; off-=p; return el; })}
    <text x="21" y="22" textAnchor="middle" fontSize="8" fontWeight="600" fill="#0b2e5c">{center}</text>
    <text x="21" y="28" textAnchor="middle" fontSize="3.2" fill="#64748b">{sub}</text></svg>
    <ul className="text-sm space-y-1">{items.map(([l,v,c])=><li key={l} className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm" style={{background:c}}/>{l}: <b>{v}</b></li>)}</ul></div>;
}
function Columns({items}){
  const max = Math.max(1,...items.map(i=>i[1]));
  return <div className="flex items-end gap-2 h-44">{items.map(([l,v])=><div key={l} className="flex-1 flex flex-col items-center justify-end h-full">
    <span className="text-xs font-semibold text-blue-900">{v}</span>
    <div className="col w-full rounded-t bg-gradient-to-t from-blue-700 to-sky-400" style={{height:`calc((100% - 36px) * ${v/max})`,minHeight:v?4:2,opacity:v?1:.3}}/>
    <span className="text-[11px] text-slate-500 mt-1 truncate max-w-full">{l}</span></div>)}</div>;
}
function Dashboard({data}){
  const t = today();
  const {tasks,meetings} = data;
  const pending = tasks.filter(x=>x.status!=="Completed");
  const stats = [
    ["Total Tasks",tasks.length,"border-blue-600"],
    ["Pending Tasks",pending.length,"border-amber-500"],
    ["Completed Tasks",tasks.length-pending.length,"border-emerald-500"],
    ["Today's Meetings",meetings.filter(m=>m.date===t).length,"border-sky-400"]
  ];
  const high = pending.filter(x=>x.priority==="High");
  const up = meetings.filter(m=>m.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,6);
  return <div className="space-y-5">
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
      {stats.map(([l,v,c],i)=><Card key={l} className={`card-h p-4 border-l-4 ${c} flex items-center justify-between`}><div><div className="text-3xl font-semibold text-blue-900">{v}</div><div className="text-sm text-slate-600 mt-1">{l}</div></div><div className="w-11 h-11 rounded-full bg-blue-50 grid place-items-center text-xl" aria-hidden="true">{["📋","⏳","✅","📅"][i]}</div></Card>)}
    </div>
    <div className="grid lg:grid-cols-2 gap-5">
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Task status</h2><Donut items={STAT.map(s=>[s,tasks.filter(t=>t.status===s).length,COL[s]])} center={`${tasks.length?Math.round((tasks.length-pending.length)/tasks.length*100):0}%`} sub="completed"/></Card>
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Tasks logged, last 7 days</h2><Columns items={[6,5,4,3,2,1,0].map(n=>{const d=daysAgo(n);return [new Date(d+"T00:00").toLocaleDateString("en-IN",{weekday:"short"}),tasks.filter(t=>t.date===d).length];})}/></Card>
    </div>
    <div className="grid lg:grid-cols-2 gap-5">
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">High-priority pending tasks</h2>
        {high.length===0 && <p className="text-sm text-slate-500">No high-priority tasks waiting. Nice work.</p>}
        <ul className="divide-y divide-blue-50">{high.map(x=><li key={x.id} className="py-2">
          <div className="flex justify-between gap-2"><span className="font-medium">{x.title}</span><Pill t={x.status}/></div>
          <div className="text-xs text-slate-500">{x.category} · {fmt(x.date)}</div></li>)}</ul>
      </Card>
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Upcoming reminders</h2>
        {up.length===0 && <p className="text-sm text-slate-500">No upcoming meetings or reminders.</p>}
        <ul className="divide-y divide-blue-50">{up.map(m=><li key={m.id} className={`py-2 ${m.date===t?"bg-amber-50 -mx-2 px-2 rounded":""}`}>
          <div className="flex justify-between gap-2"><span className="font-medium">{m.topic}</span>{m.date===t&&<span className="text-xs font-semibold text-amber-700">Today</span>}</div>
          <div className="text-xs text-slate-500">{fmt(m.date)} at {m.time||"--"}</div></li>)}</ul>
      </Card>
    </div>
  </div>;
}

function TaskForm({onAdd}){
  const blank = {title:"",category:"Hardware",priority:"Medium",date:today(),status:"Pending",notes:""};
  const [f,setF] = useState(blank);
  const set = k => e => setF({...f,[k]:e.target.value});
  const sub = e => { e.preventDefault(); if(!f.title.trim()) return; onAdd({...f,title:f.title.trim(),id:uid()}); setF(blank); };
  return <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Add new task</h2>
    <form onSubmit={sub} className="grid md:grid-cols-6 gap-3">
      <div className="md:col-span-3"><Label l="Task title"><input required className="fld" value={f.title} onChange={set("title")} placeholder="e.g. Ward 4 switch port down"/></Label></div>
      <div className="md:col-span-1"><Label l="Category"><select className="fld" value={f.category} onChange={set("category")}>{CATS.map(c=><option key={c}>{c}</option>)}</select></Label></div>
      <div className="md:col-span-1"><Label l="Priority"><select className="fld" value={f.priority} onChange={set("priority")}>{PRI.map(c=><option key={c}>{c}</option>)}</select></Label></div>
      <div className="md:col-span-1"><Label l="Status"><select className="fld" value={f.status} onChange={set("status")}>{STAT.map(c=><option key={c}>{c}</option>)}</select></Label></div>
      <div className="md:col-span-2"><Label l="Date"><input type="date" className="fld" value={f.date} onChange={set("date")}/></Label></div>
      <div className="md:col-span-4"><Label l="What happened next / follow-up notes"><textarea rows="2" className="fld" value={f.notes} onChange={set("notes")} placeholder="Actions taken, who was informed, what is pending…"/></Label></div>
      <div className="md:col-span-6"><button className="btn">Add task</button></div>
    </form></Card>;
}

function TaskRow({t,onUpdate,onDelete}){
  const [notes,setNotes] = useState(t.notes);
  const dirty = notes!==t.notes;
  return <Card className="p-4">
    <div className="flex flex-wrap items-start justify-between gap-2">
      <div><div className="font-semibold">{t.title}</div><div className="text-xs text-slate-500 mt-0.5">{t.category} · {fmt(t.date)}</div></div>
      <div className="flex items-center gap-2"><Pill t={t.priority}/>
        <select aria-label="Status" className="fld !w-auto !py-1" value={t.status} onChange={e=>onUpdate(t.id,{status:e.target.value})}>{STAT.map(s=><option key={s}>{s}</option>)}</select></div>
    </div>
    <textarea aria-label="Follow-up notes" rows="2" className="fld mt-3" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Add follow-up notes…"/>
    <div className="mt-2 flex gap-2">
      <button className="btn2 disabled:opacity-40" disabled={!dirty} onClick={()=>onUpdate(t.id,{notes})}>{dirty?"Save notes":"Notes saved"}</button>
      <button className="text-sm text-red-600 px-2" onClick={()=>{ if(confirm("Delete this task?")) onDelete(t.id); }}>Delete</button>
    </div></Card>;
}

function Tasks({data,setData}){
  const [show,setShow] = useState("Open");
  const list = [...data.tasks].filter(t=>show==="All"||(show==="Open"?t.status!=="Completed":t.status===show)).sort((a,b)=>b.date.localeCompare(a.date));
  const upd = (id,p) => setData(d=>({...d,tasks:d.tasks.map(t=>t.id===id?{...t,...p}:t)}));
  return <div className="space-y-5">
    <TaskForm onAdd={t=>setData(d=>({...d,tasks:[t,...d.tasks]}))}/>
    <div className="flex flex-wrap gap-2 items-center"><span className="text-sm text-slate-600">Show:</span>
      {["Open","In Progress","Pending","Completed","All"].map(s=><button key={s} onClick={()=>setShow(s)} className={`px-3 py-1 rounded-full text-sm border ${show===s?"bg-blue-700 text-white border-blue-700":"bg-white border-blue-200 text-blue-800"}`}>{s}</button>)}</div>
    <div className="space-y-3">{list.length===0&&<p className="text-slate-500 text-sm">No tasks here. Add one above.</p>}
      {list.map(t=><TaskRow key={t.id+t.notes} t={t} onUpdate={upd} onDelete={id=>setData(d=>({...d,tasks:d.tasks.filter(x=>x.id!==id)}))}/>)}</div>
  </div>;
}

function Meetings({data,setData}){
  const blank = {date:today(),time:"10:00",topic:"",notes:""};
  const [f,setF] = useState(blank);
  const t = today();
  const set = k => e => setF({...f,[k]:e.target.value});
  const sub = e => { e.preventDefault(); if(!f.topic.trim()) return; setData(d=>({...d,meetings:[{...f,id:uid()},...d.meetings]})); setF(blank); };
  const list = [...data.meetings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const todays = list.filter(m=>m.date===t);
  return <div className="space-y-5">
    {todays.length>0 && <div className="rounded-lg border-2 border-amber-400 bg-amber-50 p-4">
      <h2 className="font-semibold text-amber-900 mb-2">Today's reminders ({todays.length})</h2>
      {todays.map(m=><div key={m.id} className="text-sm py-1"><b>{m.time}</b> – {m.topic}{m.notes&&<span className="text-slate-600"> · {m.notes}</span>}</div>)}</div>}
    <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Add meeting or reminder</h2>
      <form onSubmit={sub} className="grid md:grid-cols-6 gap-3">
        <div className="md:col-span-2"><Label l="Date"><input type="date" className="fld" value={f.date} onChange={set("date")}/></Label></div>
        <div className="md:col-span-1"><Label l="Time"><input type="time" className="fld" value={f.time} onChange={set("time")}/></Label></div>
        <div className="md:col-span-3"><Label l="Topic / person"><input required className="fld" value={f.topic} onChange={set("topic")} placeholder="e.g. Call Dr. Patil about PACS"/></Label></div>
        <div className="md:col-span-6"><Label l="Notes"><textarea rows="2" className="fld" value={f.notes} onChange={set("notes")}/></Label></div>
        <div className="md:col-span-6"><button className="btn">Add reminder</button></div>
      </form></Card>
    <Card className="overflow-hidden"><ul className="divide-y divide-blue-50">
      {list.length===0&&<li className="p-4 text-sm text-slate-500">Nothing scheduled yet.</li>}
      {list.map(m=><li key={m.id} className={`p-4 flex justify-between gap-3 ${m.date===t?"bg-amber-50":m.date<t?"opacity-60":""}`}>
        <div><div className="font-medium">{m.topic} {m.date===t&&<span className="ml-1 text-xs font-semibold text-amber-700">Today</span>}</div>
          <div className="text-xs text-slate-500">{fmt(m.date)} at {m.time||"--"}</div>{m.notes&&<div className="text-sm mt-1">{m.notes}</div>}</div>
        <button className="text-sm text-red-600 self-start" onClick={()=>setData(d=>({...d,meetings:d.meetings.filter(x=>x.id!==m.id)}))}>Delete</button></li>)}
    </ul></Card></div>;
}

function WorkLog({data}){
  const [q,setQ] = useState(""); const [c,setC] = useState("All"); const [s,setS] = useState("All");
  const rows = useMemo(()=>data.tasks.filter(t=>(c==="All"||t.category===c)&&(s==="All"||t.status===s)&&(`${t.title} ${t.notes}`.toLowerCase().includes(q.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)),[data,q,c,s]);
  return <div className="space-y-4">
    <Card className="p-4 grid sm:grid-cols-3 gap-3">
      <input className="fld" placeholder="Search tasks and notes…" value={q} onChange={e=>setQ(e.target.value)} aria-label="Search"/>
      <select className="fld" value={c} onChange={e=>setC(e.target.value)} aria-label="Category"><option>All</option>{CATS.map(x=><option key={x}>{x}</option>)}</select>
      <select className="fld" value={s} onChange={e=>setS(e.target.value)} aria-label="Status"><option>All</option>{STAT.map(x=><option key={x}>{x}</option>)}</select>
    </Card>
    <Card className="overflow-x-auto"><table className="w-full text-sm min-w-[720px]">
      <thead className="bg-blue-700 text-white text-left"><tr>{["Date","Task","Category","Status","Follow-up / Resolution"].map(h=><th key={h} className="px-3 py-2 font-medium">{h}</th>)}</tr></thead>
      <tbody className="divide-y divide-blue-50">
        {rows.length===0&&<tr><td colSpan="5" className="p-4 text-slate-500">No records match your filters.</td></tr>}
        {rows.map(t=><tr key={t.id} className="align-top"><td className="px-3 py-2 whitespace-nowrap">{fmt(t.date)}</td><td className="px-3 py-2 font-medium">{t.title}</td><td className="px-3 py-2">{t.category}</td><td className="px-3 py-2"><Pill t={t.status}/></td><td className="px-3 py-2 whitespace-pre-wrap">{t.notes||"—"}</td></tr>)}
      </tbody></table></Card>
    <p className="text-xs text-slate-500">{rows.length} of {data.tasks.length} records shown</p>
  </div>;
}

function Reports({data,setData,setPreview,setCsv}){
  const {tasks,meetings} = data;
  const bar = (label,n,max) => <div key={label} className="mb-2"><div className="flex justify-between text-sm"><span>{label}</span><b>{n}</b></div>
    <div className="h-2 bg-blue-50 rounded"><div className="h-2 bg-blue-600 rounded" style={{width:(max?n/max*100:0)+"%"}}/></div></div>;
  const cc = CATS.map(c=>[c,tasks.filter(t=>t.category===c).length]);
  const sc = STAT.map(s=>[s,tasks.filter(t=>t.status===s).length]);
  const [busy,setBusy] = useState(false);
  const h = x => String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const dpdf = async () => {
    if(!window.jspdf || !window.html2canvas){ alert("PDF tools are still loading. Try again in a moment."); return; }
    setBusy(true);
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;padding:36px;box-sizing:border-box;background:#fff;color:#0f2742;font:13px 'IBM Plex Sans',system-ui,sans-serif";
    const th = "background:#0b5cb8;color:#fff;text-align:left;padding:6px 8px;font-weight:500";
    const td = "padding:6px 8px;border-bottom:1px solid #dbe6f4;vertical-align:top";
    const tbl = (head,rows) => `<table style="width:100%;border-collapse:collapse;margin:8px 0 20px"><tr>${head.map(x=>`<th style="${th}">${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td style="${td}">${h(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    const sorted = [...tasks].sort((a,b)=>b.date.localeCompare(a.date));
    box.innerHTML = `<div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #0b5cb8;padding-bottom:12px"><img src="${LOGO}" style="width:66px;height:66px"/><div><div style="font-size:21px;font-weight:600;color:#0b2e5c">MTES Sanjeevan Hospital</div><div style="font-size:14px;color:#0b5cb8">IT Task &amp; Work Log Report</div><div style="font-size:11px;color:#64748b">Generated on ${fmt(today())}</div></div></div>
      <p style="margin:14px 0 4px"><b>Status:</b> ${sc.map(([l,n])=>l+" "+n).join(" &nbsp;|&nbsp; ")}</p>
      <p style="margin:0 0 6px"><b>Category:</b> ${cc.map(([l,n])=>l+" "+n).join(" &nbsp;|&nbsp; ")}</p>
      <h3 style="color:#0b2e5c;margin:16px 0 0">Tasks</h3>${tbl(["Date","Task","Category","Priority","Status","Follow-up notes"],sorted.map(t=>[fmt(t.date),t.title,t.category,t.priority,t.status,t.notes||"-"]))}
      <h3 style="color:#0b2e5c;margin:16px 0 0">Meetings &amp; reminders</h3>${tbl(["Date","Time","Topic","Notes"],[...meetings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(m=>[fmt(m.date),m.time,m.topic,m.notes||"-"]))}`;
    let ok = false; try{ ok = !!(window.claude && await window.claude.use("downloads")); }catch(e){}
    if(!ok){ setPreview(box.innerHTML); setBusy(false); return; }
    document.body.appendChild(box);
    try{
      await new Promise(r=>setTimeout(r,250));
      const canvas = await window.html2canvas(box,{scale:2,backgroundColor:"#ffffff"});
      const pdf = new window.jspdf.jsPDF({unit:"pt",format:"a4"});
      const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
      const ph = Math.floor(canvas.width*H/W);
      for(let y=0,i=0;y<canvas.height;y+=ph,i++){
        const sl = document.createElement("canvas"); sl.width = canvas.width; sl.height = Math.min(ph,canvas.height-y);
        sl.getContext("2d").drawImage(canvas,0,y,canvas.width,sl.height,0,0,canvas.width,sl.height);
        if(i) pdf.addPage();
        pdf.addImage(sl.toDataURL("image/jpeg",0.92),"JPEG",0,0,W,sl.height*W/canvas.width);
      }
      await save(`MTES-IT-report-${today()}.pdf`, pdf.output("blob"));
    }catch(e){ alert("Could not create the PDF."); }
    box.remove(); setBusy(false);
  };
  const esc = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const dl = async () => {
    const rows = [["TASKS"],["Date","Title","Category","Priority","Status","Follow-up Notes"],...tasks.map(t=>[t.date,t.title,t.category,t.priority,t.status,t.notes]),[],["MEETINGS & REMINDERS"],["Date","Time","Topic","Notes"],...meetings.map(m=>[m.date,m.time,m.topic,m.notes])];
    const csv = "\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\r\n");
    if(await save(`MTES-IT-backup-${today()}.csv`, new Blob([csv],{type:"text/csv;charset=utf-8"}))==="na") setCsv(csv);
  };
  return <div className="space-y-5">
    <div className="grid md:grid-cols-2 gap-5">
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Tasks by category</h2><Columns items={cc}/></Card>
      <Card className="p-4"><h2 className="font-semibold text-blue-900 mb-3">Tasks by status</h2><Donut items={sc.map(([l,n])=>[l,n,COL[l]])} center={tasks.length} sub="tasks"/></Card>
    </div>
    <Card className="p-4 flex flex-wrap items-center justify-between gap-3">
      <div><h2 className="font-semibold text-blue-900">Backup your records</h2><p className="text-sm text-slate-600">Download all tasks, meetings and notes as a PDF report or as a CSV file that opens in Excel.</p></div>
      <div className="flex flex-wrap gap-2"><button className="btn" disabled={busy} onClick={dpdf}>{busy?"Preparing PDF…":"Export PDF report"}</button><button className="btn2" onClick={dl}>Export to CSV / Excel</button><button className="text-sm text-red-600 px-2" onClick={()=>{ if(confirm("Delete ALL tasks and meetings? Export a backup first.")) setData({tasks:[],meetings:[]}); }}>Clear all data</button></div>
    </Card>
  </div>;
}

function App(){
  const [data,setData] = useState(load);
  const [tab,setTab] = useState(0);
  const [preview,setPreview] = useState(null);
  const [csv,setCsv] = useState(null);
  useEffect(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} },[data]);
  const view = [<Dashboard data={data}/>,<Tasks data={data} setData={setData}/>,<Meetings data={data} setData={setData}/>,<WorkLog data={data}/>,<Reports data={data} setData={setData} setPreview={setPreview} setCsv={setCsv}/>][tab];
  return <div className="min-h-screen">
    <header className="hdr text-white sticky top-0 z-10 shadow-lg">
      <div className="max-w-6xl mx-auto px-4 pt-3">
        <div className="flex items-center gap-3">
          <img src={LOGO} alt="The Maharashtra Technical Education Society logo" className="w-11 h-11 rounded-full bg-white p-0.5 shrink-0"/>
          <h1 className="text-base sm:text-xl font-semibold leading-tight">MTES Sanjeevan Hospital – IT Task &amp; Work Log</h1>
          <svg className="hidden md:block ml-auto h-8 w-40 opacity-80" viewBox="0 0 160 32" fill="none" stroke="#bfe3ff" strokeWidth="2" aria-hidden="true"><path className="ecg" d="M0 16h40l6-12 8 26 7-20 5 6h94"/></svg>
        </div>
        <nav className="flex gap-1 mt-3 overflow-x-auto" aria-label="Sections">
          {TABS.map((t,i)=><button key={t} onClick={()=>setTab(i)} className={`px-4 py-2 text-sm whitespace-nowrap rounded-t-md ${tab===i?"bg-[#f1f6fc] text-blue-900 font-semibold":"text-blue-100 hover:bg-blue-700"}`}>{t}</button>)}
        </nav>
      </div>
    </header>
    <main className="max-w-6xl mx-auto px-4 py-5"><h2 className="sr-only">{TABS[tab]}</h2>{preview!==null ? <div><div className="noprint flex flex-wrap items-center gap-2 mb-3"><button className="btn" onClick={()=>window.print()}>Print / Save as PDF</button><button className="btn2" onClick={()=>setPreview(null)}>Close</button><span className="text-xs text-slate-500 w-full">Direct download is not available in this view. In the print window, choose “Save as PDF” as the printer.</span></div><div className="bg-white p-2 overflow-x-auto" style={{maxWidth:794}} dangerouslySetInnerHTML={{__html:preview}}/></div> : csv!==null ? <div><div className="flex gap-2 mb-3"><button className="btn" onClick={()=>{ try{ navigator.clipboard.writeText(csv); }catch(e){} }}>Copy CSV</button><button className="btn2" onClick={()=>setCsv(null)}>Close</button></div><p className="text-xs text-slate-500 mb-2">Direct download is not available in this view. Copy this text and paste it into Excel or Notes.</p><textarea readOnly className="fld" rows="16" value={csv} onFocus={e=>e.target.select()}/></div> : view}</main>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
